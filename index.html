  <style>
    :root{
      --forest:#18352e;
      --forest2:#24483e;
      --wine:#743c49;
      --wine-dark:#522832;
      --gold:#c9a66b;
      --champagne:#ead9b8;
      --snow:#f6f4ef;
      --paper:#efe9df;
      --ink:#23302b;
      --muted:#6f756f;
      --white:#fff;
      --serif: Georgia, "Times New Roman", serif;
      --sans: Arial, Helvetica, sans-serif;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      color:var(--ink);
      background:var(--snow);
      font-family:var(--serif);
      line-height:1.65;
    }

    img{
      max-width:100%;
    }

    h1,h2,h3,p{
      margin-top:0;
    }

    h1,h2,h3{
      font-weight:400;
      line-height:1.08;
    }

    a{
      color:inherit;
    }

    section{
      position:relative;
    }

    .eyebrow{
      font-family:var(--sans);
      font-size:.69rem;
      font-weight:700;
      line-height:1.3;
      text-transform:uppercase;
      letter-spacing:.28em;
      color:var(--wine);
      margin:0 0 1.15rem;
    }

    .eyebrow.light{
      color:var(--champagne);
    }

    /* ==================================================
       NAVIGATION
       ================================================== */

    .nav{
      position:fixed;
      z-index:100;
      left:0;
      right:0;
      top:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:18px clamp(20px,5vw,70px);
      color:white;
      transition:
        background .25s ease,
        padding .25s ease,
        box-shadow .25s ease;
    }

    .nav.scrolled{
      background:rgba(24,53,46,.96);
      padding-top:12px;
      padding-bottom:12px;
      box-shadow:0 8px 30px rgba(0,0,0,.12);
      backdrop-filter:blur(8px);
    }

    .brand{
      font-size:1.4rem;
      text-decoration:none;
      letter-spacing:.02em;
      white-space:nowrap;
    }

    .navlinks{
      display:flex;
      gap:32px;
      align-items:center;
    }
