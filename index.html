  <style>
    :root {
      --forest: #17362f;
      --forest-soft: #294a42;
      --wine: #743b49;

      --gold: #c6a36a;
      --champagne: #e7d3ad;

    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--snow);
      color: var(--ink);
      font-family: var(--serif);
      line-height: 1.65;
    }

    img {
      display: block;
      width: 100%;
    }

    a {
      color: inherit;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;

    h1,

      line-height: 1.08;

    .eyebrow {
      margin-bottom: 18px;
      color: var(--wine);
      font-family: var(--sans);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .eyebrow.light {
      color: var(--champagne);
    }

    .site-header {
      position: absolute;
      z-index: 20;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 5vw;
      color: white;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin: auto;
    }

    .logo {
      font-size: 1.3rem;
      letter-spacing: 0.08em;
      text-decoration: none;
    }

    .nav-links {

      gap: 32px;
      font-family: var(--sans);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .nav-links a {
      text-decoration: none;
    }

    .hero {

      justify-content: center;
      overflow: hidden;
      color: white;
      text-align: center;
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

      content: "";

          rgba(18, 29, 25, 0.58)
        );
    }

      padding: 120px 30px 80px;
    }
